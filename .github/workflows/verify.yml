name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  g00-geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify static entrypoint
        run: test -f index.html && test -f src/geometry.js
      - name: Run deterministic geometry tests
        run: npm test

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: browser-actions/setup-chrome@v2
        id: setup-chrome
      - name: Serve and execute site in headless Chrome
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/hexmap-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for _ in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              ready=1
              break
            fi
            sleep 0.25
          done
          test "$ready" -eq 1

          "${{ steps.setup-chrome.outputs.chrome-path }}" \
            --headless \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --virtual-time-budget=3000 \
            --dump-dom \
            http://127.0.0.1:4173/ > /tmp/hexmap-dom.html

          grep -q 'data-verdict="PASS"' /tmp/hexmap-dom.html
          grep -q '817c3a7a' /tmp/hexmap-dom.html
